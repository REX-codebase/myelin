<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="300" viewBox="0 0 1280 300" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5ff4ff"/></marker>
    <style>
      .flow{stroke-dasharray:6 8;animation:dash 1s linear infinite}
      @keyframes dash{to{stroke-dashoffset:-14}}
      .t{fill:#e9eef7;font-size:22px;font-weight:700}.s{fill:#8a96aa;font-size:15px}
      .m{font-family:JetBrains Mono,Menlo,Consolas,monospace}
    </style>
  </defs>
  <rect width="1280" height="300" rx="20" fill="#070a12"/>
  <!-- boxes -->
  <g>
    <rect x="40" y="70" width="230" height="160" rx="18" fill="#0d1322" stroke="#2a3a55"/>
    <g transform="translate(137,88)" fill="none" stroke="#5ff4ff" stroke-width="2.5"><rect width="36" height="40" rx="5"/><path d="M8 12h20M8 20h20M8 28h12"/></g>
    <text x="155" y="158" text-anchor="middle" class="t">three.myelin</text>
    <text x="155" y="186" text-anchor="middle" class="s">what changed since</text>
    <text x="155" y="206" text-anchor="middle" class="s">the model was trained</text>
  </g>
  <g>
    <rect x="370" y="70" width="230" height="160" rx="18" fill="#0d1322" stroke="#2a3a55"/>
    <g transform="translate(485,108)" stroke="#5ff4ff" stroke-width="2.5" fill="#0d1322"><path d="M-16 -8L0 -18L16 -8M-16 -8L0 4L16 -8M-16 -8L-8 14M16 -8L8 14M0 4L-8 14M0 4L8 14" fill="none"/><circle cx="0" cy="-18" r="5"/><circle cx="-16" cy="-8" r="5"/><circle cx="16" cy="-8" r="5"/><circle cx="0" cy="4" r="5"/><circle cx="-8" cy="14" r="5"/><circle cx="8" cy="14" r="5"/></g>
    <text x="485" y="158" text-anchor="middle" class="t">Any LLM</text>
    <text x="485" y="186" text-anchor="middle" class="s">reads the rules</text>
    <text x="485" y="206" text-anchor="middle" class="s m">myelin gate</text>
  </g>
  <g>
    <rect x="700" y="70" width="230" height="160" rx="18" fill="#0d1322" stroke="#2a3a55"/>
    <text x="815" y="120" text-anchor="middle" font-size="34" font-weight="700" fill="#5ff4ff" font-family="JetBrains Mono, Menlo, Consolas, monospace">{ }</text>
    <text x="815" y="158" text-anchor="middle" class="t">Script checks</text>
    <text x="815" y="186" text-anchor="middle" class="s">every ban, every file</text>
    <text x="815" y="206" text-anchor="middle" class="s m">myelin lint</text>
  </g>
  <g>
    <rect x="1030" y="70" width="210" height="160" rx="18" fill="#0b1a12" stroke="#2f7a45"/>
    <g transform="translate(1135,108)" fill="none" stroke="#7dff9a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><circle r="20"/><path d="M-9 0l6 6l12-12"/></g>
    <text x="1135" y="158" text-anchor="middle" class="t" fill="#7dff9a">Current code</text>
    <text x="1135" y="186" text-anchor="middle" class="s">or CI fails with</text>
    <text x="1135" y="206" text-anchor="middle" class="s">the exact fix</text>
  </g>
  <g stroke="#5ff4ff" stroke-width="3" fill="none" marker-end="url(#a)">
    <path class="flow" d="M280 150 H360"/><path class="flow" d="M610 150 H690"/><path class="flow" d="M940 150 H1020"/>
  </g>
  <path d="M815 240 C815 285, 485 285, 485 240" stroke="#ff3b6b" stroke-width="2" fill="none" stroke-dasharray="5 6" marker-end="url(#a)"/>
  <text x="650" y="292" text-anchor="middle" class="s" fill="#ff8aa5">FAIL → fix message + copy-exact snippet → retry</text>
</svg>
