<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .cap{opacity:0;animation:in .6s ease-out forwards}
    @keyframes in{from{opacity:0}to{opacity:1}}
  </style>
  <rect x=".5" y=".5" width="1279" height="319" rx="12" fill="#0b0f19" stroke="#1d2638"/>
  <line x1="470" y1="70" x2="810" y2="70" stroke="#1d2638" stroke-width="2" stroke-linecap="round"/>
  <rect class="cap" x="496" y="64" width="48" height="12" rx="6" fill="#5ff4ff" style="animation-delay:0.00s"/><rect class="cap" x="558" y="64" width="48" height="12" rx="6" fill="#5ff4ff" style="animation-delay:0.12s"/><rect class="cap" x="620" y="64" width="48" height="12" rx="6" fill="#5ff4ff" style="animation-delay:0.24s"/><rect class="cap" x="682" y="64" width="48" height="12" rx="6" fill="#5ff4ff" style="animation-delay:0.36s"/><rect class="cap" x="744" y="64" width="48" height="12" rx="6" fill="#5ff4ff" style="animation-delay:0.48s"/>
