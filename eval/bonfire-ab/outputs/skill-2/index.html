<!DOCTYPE html>
<html lang="en">

  canvas { display: block; }
  #hud { position: fixed; left: 14px; bottom: 12px; color: #c9b9a6; font: 12px/1.4 system-ui, sans-serif; opacity: .7; pointer-events: none; text-shadow: 0 1px 2px #000; }
</style>
<script type="importmap">
{
  "imports": {

    "three/webgpu": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.webgpu.js",
    "three/tsl": "https://cdn.jsdelivr.net/npm/three@0.186.1/build/three.tsl.js",

  }

</head>
<body>
<div id="hud">Drag to orbit · scroll to zoom · three.js r186 WebGPURenderer</div>
<script type="module">
import * as THREE from 'three/webgpu';
import {
  pass, uniform, texture, uv, vec2, vec3, float, mix, smoothstep, pow, sin, cos, abs, clamp,
  length, fract, hash, instanceIndex, time, positionWorld, positionLocal
} from 'three/tsl';
import { bloom } from 'three/addons/tsl/display/BloomNode.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

// ---------------------------------------------------------------------------
// Procedural tileable noise texture (4 channels of periodic value-noise fBm)
// ---------------------------------------------------------------------------
function makeNoiseTexture( size = 256 ) {
  const data = new Uint8Array( size * size * 4 );
  const hash2 = ( x, y, s ) => {
    let h = ( x * 374761393 + y * 668265263 + s * 2147483647 ) | 0;
    h = ( h ^ ( h >>> 13 ) ) * 1274126177 | 0;
    return ( ( h ^ ( h >>> 16 ) ) >>> 0 ) / 4294967295;
  };
  const fade = t => t * t * ( 3 - 2 * t );
  const vnoise = ( x, y, period, seed ) => {
    const xi = Math.floor( x ), yi = Math.floor( y );
    const xf = fade( x - xi ), yf = fade( y - yi );
    const x0 = ( ( xi % period ) + period ) % period, y0 = ( ( yi % period ) + period ) % period;
    const x1 = ( x0 + 1 ) % period, y1 = ( y0 + 1 ) % period;
    const a = hash2( x0, y0, seed ), b = hash2( x1, y0, seed ), c = hash2( x0, y1, seed ), d = hash2( x1, y1, seed );
    return ( a + ( b - a ) * xf ) + ( ( c + ( d - c ) * xf ) - ( a + ( b - a ) * xf ) ) * yf;
  };
  const channels = [ 4, 6, 10, 16 ]; // base lattice periods per channel
  for ( let c = 0; c < 4; c ++ ) {
    for ( let j = 0; j < size; j ++ ) for ( let i = 0; i < size; i ++ ) {
      let amp = 0.5, sum = 0, norm = 0, p = channels[ c ];
      for ( let o = 0; o < 5; o ++ ) {
        sum += amp * vnoise( i / size * p, j / size * p, p, c * 17 + o * 3 + 1 );
        norm += amp; amp *= 0.5; p *= 2;
      }
      data[ ( j * size + i ) * 4 + c ] = Math.round( ( sum / norm ) * 255 );
    }
  }
  const tex = new THREE.DataTexture( data, size, size, THREE.RGBAFormat );
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
  tex.magFilter = THREE.LinearFilter;
  tex.minFilter = THREE.LinearMipmapLinearFilter;
  tex.generateMipmaps = true;
  tex.needsUpdate = true; // data texture, stays in linear (NoColorSpace)
  return tex;
}
const noiseTex = makeNoiseTexture();
const N = ( uvNode ) => texture( noiseTex, uvNode );

// ---------------------------------------------------------------------------
// Renderer / scene / camera
// ---------------------------------------------------------------------------
const renderer = new THREE.WebGPURenderer( { antialias: true, outputBufferType: THREE.HalfFloatType } );
renderer.setPixelRatio( Math.min( window.devicePixelRatio, 1.5 ) );
renderer.setSize( window.innerWidth, window.innerHeight );
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.AgXToneMapping;
renderer.toneMappingExposure = 1.25;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFShadowMap; // soft PCF in r186 (PCFSoftShadowMap removed)
document.body.appendChild( renderer.domElement );

const scene = new THREE.Scene();
const horizon = new THREE.Color().setRGB( 0.012, 0.016, 0.03 ); // linear working space
scene.background = horizon;
scene.fog = new THREE.FogExp2( horizon, 0.045 );

const camera = new THREE.PerspectiveCamera( 50, window.innerWidth / window.innerHeight, 0.05, 400 );
camera.position.set( 3.4, 1.7, 3.8 );

const controls = new OrbitControls( camera, renderer.domElement );
controls.target.set( 0, 0.65, 0 );
controls.enableDamping = true;
controls.minDistance = 1.6;
controls.maxDistance = 16;
controls.maxPolarAngle = Math.PI * 0.49;
controls.update();

const timer = new THREE.Timer();
timer.connect( document );

// Shared fire flicker (0.7..1.2), driven from JS, used by light + emissives
const flick = uniform( 1.0 );
const FIRE_CENTER = vec3( 0, 0.3, 0 );

// ---------------------------------------------------------------------------
// Sky: gradient dome + stars
// ---------------------------------------------------------------------------
{
  const skyMat = new THREE.MeshBasicNodeMaterial( { side: THREE.BackSide, fog: false, depthWrite: false } );
  const dirY = positionLocal.normalize().y;
  const zenith = vec3( 0.0015, 0.003, 0.009 );
  const hor = vec3( 0.012, 0.016, 0.03 );
  const glow = vec3( 0.03, 0.022, 0.02 ); // faint warm haze near horizon
  const g = clamp( dirY, 0, 1 );
  skyMat.colorNode = mix( mix( hor, glow, smoothstep( 0.0, 0.05, g ).oneMinus().mul( 0.5 ) ), zenith, pow( g, 0.45 ) );
  const sky = new THREE.Mesh( new THREE.SphereGeometry( 180, 32, 16 ), skyMat );
  sky.renderOrder = - 1;
  scene.add( sky );

  const count = 3000, pos = new Float32Array( count * 3 ), col = new Float32Array( count * 3 );
  for ( let i = 0; i < count; i ++ ) {
    const u = Math.random(), v = Math.random() * 0.97 + 0.03;
    const th = u * Math.PI * 2, y = v, r = Math.sqrt( 1 - y * y );
    pos.set( [ Math.cos( th ) * r * 170, y * 170, Math.sin( th ) * r * 170 ], i * 3 );
    const b = Math.pow( Math.random(), 6 ) * 2.2 + 0.05;
    const warm = Math.random();
    col.set( [ b * ( 0.85 + warm * 0.15 ), b * 0.92, b * ( 1.05 - warm * 0.15 ) ], i * 3 );
  }
  const sg = new THREE.BufferGeometry();
  sg.setAttribute( 'position', new THREE.Float32BufferAttribute( pos, 3 ) );
  sg.setAttribute( 'color', new THREE.Float32BufferAttribute( col, 3 ) );
  const stars = new THREE.Points( sg, new THREE.PointsNodeMaterial( { vertexColors: true, fog: false, depthWrite: false } ) );
  scene.add( stars );
}

// Moonlight + ambient so the world isn't pure black outside the fire's reach
scene.add( new THREE.HemisphereLight( 0x28344d, 0x0a0806, 0.35 ) );
const moon = new THREE.DirectionalLight( 0x8aa0d0, 0.18 );
moon.position.set( - 20, 30, - 10 );
scene.add( moon );

// ---------------------------------------------------------------------------
// Ground: grass -> dirt -> scorched ash, with a glowing ember bed
// ---------------------------------------------------------------------------
{
  const mat = new THREE.MeshStandardNodeMaterial( { roughness: 1, metalness: 0 } );
  const p = positionWorld.xz;
  const r = length( p );
  const n1 = N( p.mul( 0.05 ) ).r, n2 = N( p.mul( 0.35 ) ).g, n3 = N( p.mul( 2.1 ) ).b, n4 = N( p.mul( 7.0 ) ).a;
  const grass = mix( vec3( 0.018, 0.028, 0.010 ), vec3( 0.05, 0.065, 0.022 ), n2 ).mul( n4.mul( 0.6 ).add( 0.7 ) );
  const dirt = mix( vec3( 0.045, 0.034, 0.024 ), vec3( 0.10, 0.078, 0.055 ), n3 ).mul( n4.mul( 0.5 ).add( 0.75 ) );
  const ash = mix( vec3( 0.025, 0.023, 0.022 ), vec3( 0.16, 0.15, 0.14 ), smoothstep( 0.35, 0.8, n3 ) );
  const grassMask = smoothstep( 0.42, 0.62, n1.mul( 0.5 ).add( n2.mul( 0.5 ) ) .add( 0.15 ) ).mul( smoothstep( 1.9, 3.2, r.add( n2.sub( 0.5 ).mul( 0.8 ) ) ) );
  const burnt = smoothstep( 0.7, 1.5, r.add( n2.sub( 0.5 ).mul( 0.5 ) ) ).oneMinus();
  mat.colorNode = mix( mix( dirt, grass, grassMask ), ash, burnt );
  mat.roughnessNode = mix( float( 0.95 ), float( 0.8 ), grassMask );
  // embers smouldering in the ash under the logs
  const ember = smoothstep( 0.2, 0.75, r ).oneMinus();
  const crawl = N( p.mul( 1.3 ).add( vec2( time.mul( 0.02 ), time.mul( - 0.015 ) ) ) ).r;
  mat.emissiveNode = vec3( 1.0, 0.26, 0.03 ).mul( pow( n3.mul( crawl ).mul( 2.2 ), 3.0 ) ).mul( ember ).mul( flick ).mul( 4.0 );

  const ground = new THREE.Mesh( new THREE.PlaneGeometry( 400, 400 ), mat );
  ground.rotation.x = - Math.PI / 2;
  ground.receiveShadow = true;
  scene.add( ground );
}

// ---------------------------------------------------------------------------
// Grass blades (one instanced draw, wind sway in TSL)
// ---------------------------------------------------------------------------
{
  const h = 0.22;
  const g = new THREE.PlaneGeometry( 0.025, h, 1, 4 );
  g.translate( 0, h / 2, 0 );
  const pa = g.attributes.position;
  for ( let i = 0; i < pa.count; i ++ ) {
    const t = pa.getY( i ) / h;
    pa.setX( i, pa.getX( i ) * ( 1 - t ) );
    pa.setZ( i, t * t * 0.05 ); // slight curl
  }
  g.computeVertexNormals();

  const mat = new THREE.MeshStandardNodeMaterial( { side: THREE.DoubleSide, roughness: 0.8 } );
  const vy = uv().y;
  const seed = hash( instanceIndex );
  mat.colorNode = mix( vec3( 0.01, 0.016, 0.006 ), vec3( 0.06, 0.075, 0.025 ), vy ).mul( seed.mul( 0.7 ).add( 0.6 ) );
  const sway = sin( time.mul( 1.3 ).add( seed.mul( 6.283 ) ).add( positionWorld.x.mul( 0.4 ) ) ).mul( 0.035 ).mul( vy.mul( vy ) );
  mat.positionNode = positionLocal.add( vec3( sway, 0, sway.mul( 0.6 ) ) );

  const COUNT = 26000;
  const blades = new THREE.InstancedMesh( g, mat, COUNT );
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), v = new THREE.Vector3(), e = new THREE.Euler();
  let k = 0, guard = 0;
  while ( k < COUNT && guard ++ < COUNT * 4 ) {
    const r = Math.sqrt( Math.random() * ( 13 * 13 - 2.4 * 2.4 ) + 2.4 * 2.4 );
    const a = Math.random() * Math.PI * 2;
    const x = Math.cos( a ) * r, z = Math.sin( a ) * r;
    // clumping: thin blades out in a patchy pattern
    if ( Math.sin( x * 1.3 ) * Math.cos( z * 1.1 ) + Math.sin( x * 0.37 + z * 0.51 ) * 0.8 < - 0.6 ) continue;
    e.set( ( Math.random() - 0.5 ) * 0.35, Math.random() * Math.PI * 2, ( Math.random() - 0.5 ) * 0.35 );
    q.setFromEuler( e );
    const sc = 0.5 + Math.random() * 0.9;
    s.set( sc, sc * ( 0.7 + Math.random() * 0.6 ), sc );
    m.compose( v.set( x, 0, z ), q, s );
    blades.setMatrixAt( k ++, m );
  }
  blades.count = k;
  blades.receiveShadow = true;
  scene.add( blades );
}

// ---------------------------------------------------------------------------
// Logs: displaced cylinders, bark -> char -> glowing cracks by distance to fire
// ---------------------------------------------------------------------------
const logMat = new THREE.MeshStandardNodeMaterial( { roughness: 0.92, metalness: 0 } );
{
  const lu = uv();
  const heat = smoothstep( 0.15, 1.05, length( positionWorld.sub( FIRE_CENTER ) ) ).oneMinus();
  const bark = N( lu.mul( vec2( 3, 1.5 ) ) );
  const grain = N( vec2( lu.x.mul( 9 ), lu.y.mul( 0.5 ) ) ).g;
  const barkCol = mix( vec3( 0.07, 0.045, 0.028 ), vec3( 0.2, 0.13, 0.075 ), grain ).mul( bark.r.mul( 0.6 ).add( 0.6 ) );
  const charCol = mix( vec3( 0.012, 0.011, 0.010 ), vec3( 0.045, 0.04, 0.036 ), bark.b );
  const ashCol = vec3( 0.22, 0.21, 0.2 );
  const charAmt = smoothstep( 0.1, 0.45, heat.add( bark.r.sub( 0.5 ).mul( 0.35 ) ) );
  const ashAmt = smoothstep( 0.62, 0.8, bark.a ).mul( heat ).mul( 0.7 );
  logMat.colorNode = mix( mix( barkCol, charCol, charAmt ), ashCol, ashAmt );
  logMat.roughnessNode = mix( float( 0.85 ), float( 0.98 ), charAmt );

  // alligator-skin cracks: ridges of mid-valued noise, crawling glow
  const cn = N( lu.mul( vec2( 5, 2.5 ) ) ).g;
  const cracks = pow( abs( cn.mul( 2 ).sub( 1 ) ).oneMinus(), 9.0 );
  const crawl = N( vec2( lu.x.mul( 2 ).add( time.mul( 0.04 ) ), lu.y.mul( 1.5 ).sub( time.mul( 0.09 ) ) ) ).r;
  const glowAmt = cracks.mul( 1.2 ).add( pow( crawl, 3.0 ).mul( 0.6 ) ).mul( smoothstep( 0.4, 0.95, heat ) ).mul( crawl.mul( 1.6 ) );
  logMat.emissiveNode = mix( vec3( 0.9, 0.12, 0.01 ), vec3( 1.0, 0.45, 0.08 ), clamp( glowAmt, 0, 1 ) ).mul( glowAmt ).mul( flick ).mul( 7.0 );
}

function makeLogGeometry( radius, len ) {
  const g = new THREE.CylinderGeometry( radius, radius * 0.9, len, 20, 14, false );
  const pa = g.attributes.position;
  const p1 = Math.random() * 6.28, p2 = Math.random() * 6.28, p3 = Math.random() * 6.28;
  for ( let i = 0; i < pa.count; i ++ ) {
    const x = pa.getX( i ), y = pa.getY( i ), z = pa.getZ( i );
    const a = Math.atan2( z, x );
    const f = 1 + 0.07 * Math.sin( a * 3 + p1 + y * 3 ) + 0.035 * Math.sin( a * 7 + p2 + y * 9 ) + 0.03 * Math.sin( y * 17 + p3 ) * Math.sin( a * 2 );
    pa.setX( i, x * f ); pa.setZ( i, z * f );
  }
  g.computeVertexNormals();
  return g;
}

function placeLog( from, to, radius ) {
  const dir = new THREE.Vector3().subVectors( to, from );
  const len = dir.length() + 0.12;
  const mesh = new THREE.Mesh( makeLogGeometry( radius, len ), logMat );
  mesh.position.copy( from ).add( to ).multiplyScalar( 0.5 );
  mesh.quaternion.setFromUnitVectors( new THREE.Vector3( 0, 1, 0 ), dir.normalize() );
  mesh.rotateY( Math.random() * 6.28 );
  mesh.castShadow = true;
  mesh.receiveShadow = true;
  scene.add( mesh );
}
// two cross logs on the bed
placeLog( new THREE.Vector3( - 0.85, 0.09, - 0.2 ), new THREE.Vector3( 0.8, 0.11, 0.25 ), 0.095 );
placeLog( new THREE.Vector3( - 0.3, 0.1, 0.85 ), new THREE.Vector3( 0.25, 0.22, - 0.8 ), 0.085 );
// teepee
for ( let i = 0; i < 7; i ++ ) {
  const a = i / 7 * Math.PI * 2 + ( Math.random() - 0.5 ) * 0.35;
  const br = 0.72 + Math.random() * 0.12;
  const base = new THREE.Vector3( Math.cos( a ) * br, 0.06, Math.sin( a ) * br );
  const top = new THREE.Vector3( Math.cos( a + 2.4 ) * 0.08, 0.95 + Math.random() * 0.12, Math.sin( a + 2.4 ) * 0.08 );
  placeLog( base, top, 0.055 + Math.random() * 0.025 );
}

// ---------------------------------------------------------------------------
// Coals (instanced lumps in the bed)
// ---------------------------------------------------------------------------
{
  const mat = new THREE.MeshStandardNodeMaterial( { roughness: 0.95 } );
  const s = hash( instanceIndex.add( 31 ) );
  mat.colorNode = vec3( 0.02, 0.018, 0.016 );
  const n = N( positionWorld.xz.mul( 2.2 ).add( vec2( positionWorld.y.mul( 3 ), time.mul( 0.05 ) ) ) ).r;
  const pulse = sin( time.mul( s.mul( 1.5 ).add( 0.5 ) ).add( s.mul( 20 ) ) ).mul( 0.25 ).add( 0.75 );
  mat.emissiveNode = vec3( 1.0, 0.28, 0.035 ).mul( pow( n.mul( 1.7 ), 4.0 ).mul( s.mul( 0.8 ).add( 0.4 ) ).mul( pulse ).mul( flick ).mul( 6.0 ) );
  const g = new THREE.IcosahedronGeometry( 1, 1 );
  const pa = g.attributes.position;
  for ( let i = 0; i < pa.count; i ++ ) {
    const x = pa.getX( i ), y = pa.getY( i ), z = pa.getZ( i );
    // position-based (not per-vertex random) so the non-indexed faces stay welded
    const f = 0.85 + 0.15 * Math.sin( x * 4.1 + 1.3 ) * Math.sin( y * 3.7 + 0.4 ) + 0.08 * Math.sin( z * 6.3 + x * 2.0 );
    pa.setXYZ( i, x * f, y * f, z * f );
  }
  g.computeVertexNormals();
  const COUNT = 80;
  const coals = new THREE.InstancedMesh( g, mat, COUNT );
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), sc = new THREE.Vector3(), v = new THREE.Vector3();
  for ( let i = 0; i < COUNT; i ++ ) {
    const r = Math.sqrt( Math.random() ) * 0.6, a = Math.random() * 6.28;
    const k = 0.04 + Math.random() * 0.07;
    q.setFromEuler( new THREE.Euler( Math.random() * 6, Math.random() * 6, Math.random() * 6 ) );
    sc.set( k, k * 0.6, k * ( 0.8 + Math.random() * 0.5 ) );
    m.compose( v.set( Math.cos( a ) * r, k * 0.3, Math.sin( a ) * r ), q, sc );
    coals.setMatrixAt( i, m );
  }
  coals.receiveShadow = true;
  scene.add( coals );
}

// ---------------------------------------------------------------------------
// Stone ring
// ---------------------------------------------------------------------------
{
  const mat = new THREE.MeshStandardNodeMaterial( { roughness: 0.85, metalness: 0 } );
  const pw = positionWorld;
  const n = N( pw.xz.mul( 2.5 ).add( pw.y.mul( 1.7 ) ) ).r;
  const fine = N( pw.xz.mul( 11 ).add( pw.y.mul( 9 ) ) ).b;
  const base = mix( vec3( 0.07, 0.066, 0.062 ), vec3( 0.2, 0.19, 0.175 ), n ).mul( fine.mul( 0.5 ).add( 0.75 ) );
  const soot = smoothstep( 1.15, 1.6, length( pw.xz ) ).oneMinus().mul( 0.75 );
  mat.colorNode = base.mul( soot.oneMinus() );
  const COUNT = 17;
  for ( let i = 0; i < COUNT; i ++ ) {
    const g = new THREE.IcosahedronGeometry( 1, 3 );
    const pa = g.attributes.position;
    const ph = [ Math.random() * 6, Math.random() * 6, Math.random() * 6 ];
    const v = new THREE.Vector3();
    for ( let j = 0; j < pa.count; j ++ ) {
      v.fromBufferAttribute( pa, j );
      const f = 1 + 0.14 * Math.sin( v.x * 2.3 + ph[ 0 ] ) * Math.sin( v.y * 2.1 + ph[ 1 ] ) + 0.06 * Math.sin( v.z * 5.3 + ph[ 2 ] ) + 0.025 * Math.sin( v.x * 11 + v.y * 9 );
      v.multiplyScalar( f );
      pa.setXYZ( j, v.x, v.y, v.z );
    }
    g.computeVertexNormals();
    const stone = new THREE.Mesh( g, mat );
    const a = i / COUNT * Math.PI * 2 + ( Math.random() - 0.5 ) * 0.15;
    const r = 1.38 + ( Math.random() - 0.5 ) * 0.12;
    const sx = 0.17 + Math.random() * 0.08;
    stone.scale.set( sx, 0.11 + Math.random() * 0.07, 0.13 + Math.random() * 0.06 );
    stone.position.set( Math.cos( a ) * r, stone.scale.y * 0.45, Math.sin( a ) * r );
    stone.rotation.set( ( Math.random() - 0.5 ) * 0.3, - a + ( Math.random() - 0.5 ) * 0.4, ( Math.random() - 0.5 ) * 0.3 );
    stone.castShadow = true;
    stone.receiveShadow = true;
    scene.add( stone );
  }
}

// Distant tree-line silhouettes (fogged)
{
  const g = new THREE.ConeGeometry( 1, 1, 7 );
  g.translate( 0, 0.5, 0 );
  const mat = new THREE.MeshStandardNodeMaterial( { color: 0x050806, roughness: 1 } );
  const COUNT = 260;
  const trees = new THREE.InstancedMesh( g, mat, COUNT );
  const m = new THREE.Matrix4(), q = new THREE.Quaternion(), s = new THREE.Vector3(), v = new THREE.Vector3();
  for ( let i = 0; i < COUNT; i ++ ) {
    const a = Math.random() * 6.28, r = 26 + Math.random() * 30, hgt = 6 + Math.random() * 9;
    s.set( hgt * 0.28, hgt, hgt * 0.28 );
    m.compose( v.set( Math.cos( a ) * r, 0, Math.sin( a ) * r ), q, s );
    trees.setMatrixAt( i, m );
  }
  scene.add( trees );
}

// ---------------------------------------------------------------------------
// Fire light (flickering, shadow-casting point light)
// ---------------------------------------------------------------------------
const fireLight = new THREE.PointLight( 0xff8a3c, 22, 0, 2 );
fireLight.position.set( 0, 0.55, 0 );
fireLight.castShadow = true;
fireLight.shadow.mapSize.set( 1024, 1024 );
fireLight.shadow.camera.near = 0.05;
fireLight.shadow.camera.far = 30;
fireLight.shadow.radius = 4; // no bias to start (r183+ shadow improvements)
scene.add( fireLight );
// soft non-shadowed bounce from the flame tops
const fillLight = new THREE.PointLight( 0xff6a20, 4, 0, 2 );
fillLight.position.set( 0, 1.5, 0 );
scene.add( fillLight );

// ---------------------------------------------------------------------------
// Flames: layered Y-billboard sheets with scrolling noise erosion (additive, HDR)
// ---------------------------------------------------------------------------
function makeFlameMaterial( seed, speed, gain ) {
  const m = new THREE.MeshBasicNodeMaterial( {
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, side: THREE.DoubleSide, fog: false
  } );
  const vUv = uv();
  const y = vUv.y;
  const t = time.mul( speed );
  const n1 = N( vec2( vUv.x.mul( 0.7 ).add( seed ), y.mul( 0.5 ).sub( t.mul( 0.7 ) ) ) ).r;
  const n2 = N( vec2( vUv.x.mul( 1.5 ).sub( seed * 1.7 ), y.mul( 1.1 ).sub( t.mul( 1.4 ) ) ) ).g;
  const n3 = N( vec2( vUv.x.mul( 3.0 ).add( seed * 0.3 ), y.mul( 2.2 ).sub( t.mul( 2.3 ) ) ) ).b;
  const sway = n1.sub( 0.5 ).mul( 0.55 ).mul( y.mul( 1.2 ).add( 0.1 ) ).add( sin( t.mul( 1.3 ).add( seed * 10 ) ).mul( 0.05 ).mul( y ) );
  const x = vUv.x.sub( 0.5 ).add( sway );
  const width = pow( y.oneMinus(), 0.85 ).mul( 0.36 ).add( 0.015 );
  const body = smoothstep( width.mul( 0.15 ), width, abs( x ) ).oneMinus();
  const turb = n2.mul( 0.65 ).add( n3.mul( 0.35 ) );
  const erosion = smoothstep( y.mul( 0.8 ), y.mul( 0.8 ).add( 0.28 ), turb.add( 0.12 ) );
  const baseFade = smoothstep( 0.0, 0.12, y );
  const d = clamp( body.mul( erosion ).mul( baseFade ), 0, 1 );
  const heat = d.mul( y.mul( 0.75 ).oneMinus() );
  const col = mix(
    mix( vec3( 0.5, 0.035, 0.0 ), vec3( 1.0, 0.3, 0.025 ), smoothstep( 0.05, 0.45, heat ) ),
    vec3( 1.0, 0.75, 0.4 ), smoothstep( 0.45, 0.85, heat )
  );
  m.colorNode = col.mul( d ).mul( flick ).mul( gain );
  return m;
}
const flames = [];
{
  const defs = [
    [ 0.0, 0.0, 1.1, 2.1, 1.0, 3.2 ],
    [ 0.12, 0.08, 0.9, 1.7, 1.15, 2.6 ],
    [ - 0.14, - 0.06, 0.95, 1.8, 0.9, 2.6 ],
    [ 0.05, - 0.15, 0.8, 1.4, 1.3, 2.2 ],
    [ - 0.08, 0.16, 0.85, 1.5, 1.05, 2.2 ],
    [ 0.22, - 0.05, 0.6, 1.1, 1.4, 1.8 ],
    [ - 0.22, 0.04, 0.6, 1.0, 1.25, 1.8 ]
  ];
  defs.forEach( ( [ x, z, w, h, speed, gain ], i ) => {
    const geo = new THREE.PlaneGeometry( w, h );
    geo.translate( 0, h / 2, 0 );
    const mesh = new THREE.Mesh( geo, makeFlameMaterial( i * 0.137 + 0.05, speed, gain ) );
    mesh.position.set( x, 0.12, z );
    mesh.renderOrder = 2;
    mesh.frustumCulled = false;
    scene.add( mesh );
    flames.push( mesh );
  } );
}

// ---------------------------------------------------------------------------
// Sparks / rising embers: stateless GPU particles (SpriteNodeMaterial + instancing)
// ---------------------------------------------------------------------------
function particleMesh( material, count ) {
  const mesh = new THREE.InstancedMesh( new THREE.PlaneGeometry( 1, 1 ), material, count );
  const m = new THREE.Matrix4();
  for ( let i = 0; i < count; i ++ ) mesh.setMatrixAt( i, m );
  mesh.frustumCulled = false;
  return mesh;
}

  const mat = new THREE.SpriteNodeMaterial( { transparent: true, depthWrite: false, blending: THREE.AdditiveBlending, fog: false } );
  const s1 = hash( instanceIndex ), s2 = hash( instanceIndex.add( 101 ) ), s3 = hash( instanceIndex.add( 271 ) ), s4 = hash( instanceIndex.add( 997 ) );
  const life = fract( time.mul( s2.mul( 0.3 ).add( 0.28 ) ).add( s1 ) );
  const ang = s3.mul( 6.2831 );
  const rad = s4.mul( 0.4 ).add( life.mul( 0.35 ) );
  const rise = life.mul( s1.mul( 2.6 ).add( 1.4 ) );
  const wobX = sin( time.mul( 3.1 ).add( s1.mul( 40 ) ) ).mul( 0.14 ).mul( life );
  const wobZ = cos( time.mul( 2.3 ).add( s2.mul( 30 ) ) ).mul( 0.12 ).mul( life );
  const wind = life.mul( life ).mul( 0.7 );
  mat.positionNode = vec3( cos( ang ).mul( rad ).add( wobX ).add( wind ), rise.add( 0.25 ), sin( ang ).mul( rad ).add( wobZ ) );
  mat.scaleNode = life.oneMinus().mul( s4.mul( 0.6 ).add( 0.5 ) ).mul( 0.03 );
  const dist = length( uv().sub( 0.5 ) );
  const shape = pow( smoothstep( 0.0, 0.5, dist ).oneMinus(), 2.0 );
  const twinkle = sin( time.mul( 25 ).add( s1.mul( 100 ) ) ).mul( 0.35 ).add( 0.65 );
  const fade = pow( life.oneMinus(), 1.5 );
  mat.colorNode = mix( vec3( 1.0, 0.8, 0.4 ), vec3( 1.0, 0.22, 0.02 ), life ).mul( shape ).mul( fade ).mul( twinkle ).mul( 14.0 );
  scene.add( particleMesh( mat, 220 ) );
}

// ---------------------------------------------------------------------------
// Post: RenderPipeline + bloom (tone mapping applied once at the end)
// ---------------------------------------------------------------------------
const renderPipeline = new THREE.RenderPipeline( renderer );
const scenePass = pass( scene, camera );
const scenePassColor = scenePass.getTextureNode( 'output' );
const bloomPass = bloom( scenePassColor, 0.85, 0.55, 0.7 );
renderPipeline.outputNode = scenePassColor.add( bloomPass );

// ---------------------------------------------------------------------------
// Loop
// ---------------------------------------------------------------------------
window.addEventListener( 'resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize( window.innerWidth, window.innerHeight );
} );

let smoothRand = 0;
renderer.setAnimationLoop( () => {
  timer.update();
  const t = timer.getElapsed();
  const dt = Math.min( timer.getDelta(), 0.05 );

  // layered flicker: low-frequency breathing + fast crackle + smoothed randomness
  smoothRand += ( ( Math.random() - 0.5 ) - smoothRand ) * Math.min( 1, dt * 12 );
  const f = 0.92 + 0.08 * Math.sin( t * 1.7 ) + 0.06 * Math.sin( t * 7.3 + 1.1 ) + 0.04 * Math.sin( t * 13.9 + 2.3 ) + 0.18 * smoothRand;
  flick.value = f;
  fireLight.intensity = 22 * f;
  fillLight.intensity = 4 * ( 0.8 + 0.4 * f );
  fireLight.position.set( 0.04 * Math.sin( t * 5.1 ), 0.55 + 0.04 * Math.sin( t * 6.7 ), 0.04 * Math.cos( t * 4.3 ) );

  // cylindrical billboards for flame sheets
  for ( const m of flames ) {
    m.rotation.y = Math.atan2( camera.position.x - m.position.x, camera.position.z - m.position.z );
  }

  controls.update();
  renderPipeline.render();
} );
