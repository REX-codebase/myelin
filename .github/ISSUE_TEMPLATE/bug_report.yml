name: Something is broken
description: The CLI, an installer, or the website does not work as documented.
title: "[bug] "
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: The command you ran, and its output
      description: If it is the installer or setup, run `myelin doctor` and paste that too.
      render: text
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Myelin, Node and OS versions
      description: For example `myelin 0.4.0, node 22.12, macOS 15`.
    validations:
      required: true
